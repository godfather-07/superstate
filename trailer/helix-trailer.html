<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Helix Trailer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#1D4FF0;--blue2:#4F7BFF;--accent:#2546E8;--light:#F3F3F0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
body{font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:#000;color:#fff}
.layer{position:absolute;left:0;top:0;width:1920px;height:1080px}
.abs{position:absolute}
.U{font-family:Unbounded,Inter,sans-serif;letter-spacing:-0.035em}
.m{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .02em .1em;margin-bottom:-.1em}
.mi{display:inline-block;will-change:transform}
.rl{position:relative;display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em}
.ra{display:inline-block;white-space:pre;will-change:transform}
.rb{position:absolute;left:0;top:0;white-space:pre;will-change:transform}
.rl.right .rb{left:auto;right:0}
.rl.center .rb{left:0;right:0;text-align:center}

/* worlds */
#bgBlue{background:var(--blue);overflow:hidden}
.cloud{position:absolute;border-radius:50%;background:radial-gradient(circle at 50% 50%,rgba(79,123,255,.95) 0%,rgba(79,123,255,.55) 30%,rgba(79,123,255,0) 68%)}
#bgLight{background:radial-gradient(ellipse 75% 70% at 50% 48%,rgba(0,0,0,0) 55%,rgba(0,0,0,.075) 100%),var(--light)}
#grain{pointer-events:none}
#flash{background:#fff;opacity:0;pointer-events:none}
#dim{background:#000;opacity:0;pointer-events:none}

/* wheel */
.wheel{position:absolute;left:0;top:0;width:520px;height:520px;transform-origin:50% 50%;
  --disc:#0A090B;--hair:rgba(255,255,255,.085);--sel:#3A3A40;--icon:#fff;--ring:#2546E8;--center:#0A090B;
  --txt:#fff;--mut:#8b8b93;--bar:#fff;--rim:rgba(255,255,255,.10);--shadow:0 40px 90px rgba(2,10,70,.45),0 8px 24px rgba(2,10,70,.3)}
.wheel.light{--ring:#BDBDBD;--shadow:0 40px 80px rgba(0,0,0,.26),0 6px 18px rgba(0,0,0,.18)}
.wheel.native{--disc:rgba(64,64,72,.52);--center:rgba(36,36,42,.62);--hair:rgba(255,255,255,.16);--sel:rgba(255,255,255,.18);
  --ring:rgba(255,255,255,.42);--rim:rgba(255,255,255,.55);--shadow:0 30px 70px rgba(0,0,0,.2)}
.wheel.tinted{--disc:#fff;--center:#fff;--icon:#2546E8;--hair:rgba(0,0,0,.07);--sel:#E8EDFF;--bar:#2546E8;--ring:#D3DCFF;
  --txt:#121216;--mut:#8a8f9c;--rim:rgba(0,0,0,.06);--shadow:0 40px 80px rgba(20,40,120,.16),0 6px 18px rgba(0,0,0,.08)}
.wheel svg{position:absolute;left:0;top:0;overflow:visible}
.w-shadow{position:absolute;inset:4px;border-radius:50%;box-shadow:var(--shadow)}
.w-glass{position:absolute;inset:0;border-radius:50%;opacity:0;-webkit-backdrop-filter:blur(26px) saturate(1.7);backdrop-filter:blur(26px) saturate(1.7)}
.wheel.native .w-glass{opacity:1}
.w-disc{fill:var(--disc)}
.w-hair line{stroke:var(--hair);stroke-width:1}
.w-selfill{fill:var(--sel)}
.w-bar{stroke:var(--bar);fill:none}
.w-ic{fill:none;stroke:var(--icon);stroke-width:1.07;stroke-linecap:round;stroke-linejoin:round}
.w-ic .f{fill:var(--icon)}
.w-ring{stroke:var(--ring);fill:var(--center)}
.w-rim{stroke:var(--rim);fill:none;stroke-width:1.2}
.wheel.tinted .w-bev,.wheel.native .w-bev{opacity:.4}
.w-center{position:absolute;left:146px;top:146px;width:228px;height:228px;border-radius:50%;color:var(--txt)}
.w-player,.w-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.w-art{width:46px;height:46px;border-radius:10px;background:radial-gradient(circle at 30% 30%,#ff5a6e,#b3122b 55%,#3a0510);box-shadow:0 4px 12px rgba(0,0,0,.35);margin-bottom:10px}
.w-song{font-size:15px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.w-artist{font-size:12.5px;color:var(--mut);margin-top:2px}
.w-ctl{display:flex;gap:16px;margin-top:10px;align-items:center}
.w-ctl svg{position:static;fill:var(--txt)}
.w-lname{font-family:Unbounded,Inter,sans-serif;font-weight:700;font-size:20px;letter-spacing:-.03em;line-height:1.15}
.w-lsub{font-size:12.5px;color:var(--mut);margin-top:6px}
.w-pager{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-size:10.5px;color:var(--mut);letter-spacing:.02em;font-weight:500}

/* S1 game wheel */
.gseg{position:absolute;left:0;top:0;width:680px;height:680px;will-change:transform,filter,opacity}
.gseg svg{position:absolute;left:0;top:0}
.gcenter{position:absolute;left:240px;top:240px;width:200px;height:200px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;

.gcenter small{font-size:12px;letter-spacing:.24em;opacity:.7;font-weight:600}
.gcenter b{font-family:Unbounded,sans-serif;font-size:30px;font-weight:700;letter-spacing:-.03em;margin-top:4px}
.gcenter i{font-style:normal;font-size:13px;opacity:.75;margin-top:6px;font-weight:500}
#shock{position:absolute;width:680px;height:680px;border-radius:50%;border:3px solid rgba(255,255,255,.95);box-shadow:0 0 30px rgba(255,255,255,.5),inset 0 0 30px rgba(255,255,255,.35);left:220px;top:200px;opacity:0}

/* S2 counter */

.sub-ic{fill:none;stroke:#fff;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round}

/* S3 title */
.title{position:absolute;left:0;width:1920px;text-align:center;color:#fff}
.t1{top:330px;font-size:140px;font-weight:800;line-height:1.1}

.wb{display:flex;height:844px}

.si{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;margin-bottom:2px}
.si.on{background:#e4e6ee;font-weight:600}
.si .th{width:30px;height:22px;border-radius:5px;flex:none}

.main{flex:1;position:relative;padding:48px 84px}

.h1{font-size:44px;font-weight:700;letter-spacing:-.025em;line-height:1.12;margin-top:14px;max-width:880px}
.by{font-size:15px;color:#7b7b84;margin-top:16px}
.fig{height:230px;border-radius:14px;margin-top:30px;background:
  radial-gradient(ellipse 40% 60% at 25% 70%,#7fb2ff,transparent 70%),radial-gradient(ellipse 50% 60% at 75% 30%,#c6a3ff,transparent 70%),linear-gradient(120deg,#203a8f,#5b3fbf)}
.bar{height:13px;border-radius:7px;background:#e9e9ee;margin-top:16px}
.mrow{display:flex;align-items:center;height:56px;border-bottom:1px solid #efeff2;font-size:19px;color:#8a8a92;gap:14px}

.chip{background:#eef2ff;color:#2546E8;border-radius:7px;padding:5px 11px;font-size:17px;font-weight:500}
.mbody{margin-top:28px;font-size:22px;line-height:1.55;color:#202024;white-space:normal;max-width:1000px}
.mbody a{color:#2546E8;text-decoration:underline;text-underline-offset:3px}
.caret{display:inline-block;width:2px;height:1.05em;background:currentColor;vertical-align:-.15em;margin-left:1px}
.send{margin-left:auto;width:38px;height:30px;border-radius:8px;background:#2546E8;display:flex;align-items:center;justify-content:center}

/* tool panels */

.ph{display:flex;align-items:center;gap:10px;padding:16px 18px 12px;font-size:15px;font-weight:600}
.ph .pic{width:28px;height:28px;border-radius:8px;background:#222226;display:flex;align-items:center;justify-content:center}
.ph .pr{margin-left:auto;font-size:12.5px;color:#7d7d86;font-weight:500;background:#1c1c20;border-radius:6px;padding:4px 8px}
.ps{margin:2px 16px 8px;height:44px;border-radius:11px;background:#1B1B1E;border:1px solid #242428;display:flex;align-items:center;gap:10px;padding:0 14px;color:#6f6f78;font-size:15px}
.pbody{flex:1;position:relative;overflow:hidden}
.pl{position:relative;padding:4px 8px}
.row{position:relative;display:flex;align-items:center;gap:13px;height:64px;padding:0 12px;z-index:1}
.ri{width:34px;height:34px;border-radius:9px;background:#1d1d21;display:flex;align-items:center;justify-content:center;flex:none;color:#cfcfd6}
.rt{font-size:16px;font-weight:500;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:470px}
.rm{font-size:13px;color:#7d7d86;margin-top:2px}
.rk{margin-left:auto;font-size:12px;color:#7d7d86}
.psel{position:absolute;left:8px;right:8px;top:4px;height:64px;background:#26262C;border-radius:11px;z-index:0}
.pf{display:flex;gap:20px;padding:12px 18px;border-top:1px solid #222226;font-size:12.5px;color:#85858e;align-items:center}
.pf span{display:flex;align-items:center;gap:7px}
.pf kbd{font-family:Inter,sans-serif;font-size:11.5px;background:#232327;border:1px solid #2e2e33;border-radius:5px;padding:2px 6px;color:#cfcfd6;min-width:20px;text-align:center}
.pf .hot kbd{background:#2546E8;border-color:#2546E8;color:#fff}
.pbox{margin:2px 16px 0;min-height:112px;border-radius:12px;background:#1B1B1E;border:1px solid #2a2a30;padding:14px 16px;font-size:17px;line-height:1.5;color:#f0f0f3}
.alab{margin:16px 18px 6px;font-size:12.5px;color:#8a8a93;display:flex;align-items:center;gap:7px;font-weight:600;letter-spacing:.02em}
.atext{padding:0 18px;font-size:15.5px;line-height:1.55;color:#dcdce2}
.toast{position:absolute;left:810px;top:900px;background:#1FA45A;color:#fff;font-weight:600;font-size:18px;padding:12px 22px 12px 16px;border-radius:999px;
  display:flex;align-items:center;gap:10px;box-shadow:0 18px 40px rgba(20,120,60,.35);transform-origin:50% 50%;white-space:nowrap}
.hud-lab{position:absolute;right:80px;top:70px;text-align:right;color:#0B0B0D}
.hud-lab small{display:block;font-size:14px;font-weight:600;letter-spacing:.2em;color:#8a8a92;margin-bottom:6px}
.hud-lab .rl{font-size:50px;font-weight:800;line-height:1.1}

/* S6 */
.looks{position:absolute;left:170px;top:330px;color:#0B0B0D;width:820px}
.looks .lk-cap{font-size:26px;font-weight:600;color:#6b6b72}
.looks .lk-name{margin-top:18px;font-size:150px;font-weight:800;line-height:1.05}
.looks .lk-sub{margin-top:18px;font-size:34px;color:#7a7a82;line-height:1.3}
.looks .lk-mode{margin-top:30px;display:inline-flex;align-items:center;gap:10px;font-size:15px;font-weight:600;letter-spacing:.18em;color:#55555c;
  border:1px solid #d8d8dc;border-radius:999px;padding:8px 16px 8px 12px;text-transform:uppercase}
.lk-dot{width:10px;height:10px;border-radius:50%;background:#0A090B}
.blob{position:absolute;border-radius:50%}

/* S7 */
.tname{position:absolute;font-size:33px;font-weight:600;white-space:nowrap;transform-origin:50% 50%;display:flex;align-items:center;gap:10px}
.tname i{width:9px;height:9px;border-radius:50%;display:inline-block}
.big16{position:absolute;left:0;top:868px;width:1920px;text-align:center;color:#0B0B0D;font-size:118px;font-weight:800;line-height:1.1}

/* S8 carousel */
.car{position:absolute;left:0;top:0;width:1920px;height:1080px;perspective:1600px;perspective-origin:50% 42%}
.card{position:absolute;left:700px;top:150px;width:520px;height:620px;transform-origin:50% 50%;will-change:transform,filter}
.card .panel{position:relative;width:520px;height:620px}
.car-lab{position:absolute;left:0;top:834px;width:1920px;text-align:center;color:#0B0B0D;font-size:64px;font-weight:800}
.big-clock{position:relative;width:300px;height:300px;margin:18px auto 0}
.big-clock .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tabs{display:flex;gap:6px;margin:4px 16px 0;background:#1b1b1e;border-radius:10px;padding:4px}
.tabs span{flex:1;text-align:center;font-size:13.5px;padding:8px 0;border-radius:7px;color:#8b8b93;font-weight:500}

.btns{display:flex;gap:14px;justify-content:center;margin-top:22px}

.btns span.pri{background:#2546E8}
.calc-ex{padding:30px 26px 0;text-align:right;font-size:36px;color:#8b8b93;font-weight:500}

.wave{display:flex;align-items:center;justify-content:center;gap:5px;height:150px;margin-top:20px}

/* S9 */
.end{position:absolute;left:0;width:1920px;text-align:center;color:#fff}
.logo{position:absolute;left:875px;top:190px;width:170px;height:170px}
.e-name{top:398px;font-size:130px;font-weight:800;line-height:1.1}
.e-tag{top:575px;font-size:40px;font-weight:500;opacity:.9}
.e-btn{position:absolute;left:50%;top:675px;display:flex;align-items:center;gap:14px;background:#0A090B;color:#fff;border-radius:999px;padding:22px 40px 22px 32px;font-size:27px;font-weight:600;
  box-shadow:0 20px 50px rgba(0,10,60,.4);white-space:nowrap}
.e-small{top:812px;font-size:22px;font-weight:500;opacity:.75}

#pauseTag{position:fixed;left:14px;top:12px;font:600 12px Inter,sans-serif;color:#fff;background:rgba(255,255,255,.14);padding:5px 10px;border-radius:99px;display:none;z-index:10;letter-spacing:.06em}

<body>
<div id="stage"></div>
<div id="pauseTag">PAUSED · SPACE TO PLAY · ←/→ SCENES</div>
<script>
(() => {
'use strict';
const DUR = 46;
const SCENES = [0, 0.6, 8.0, 10.0, 11.2, 27.0, 31.5, 35.5, 41.5];
const stage = document.getElementById('stage');

/* ---------------------------------------------------------------- utils */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const n = x => Math.round(x * 1000) / 1000;
function bezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const sx = u => ((ax * u + bx) * u + cx) * u, sy = u => ((ay * u + by) * u + cy) * u;
  const dx = u => (3 * ax * u + 2 * bx) * u + cx;
  return x => {
    if (x <= 0) return 0; if (x >= 1) return 1;
    let u = x;
    for (let i = 0; i < 8; i++) { const e = sx(u) - x, d = dx(u); if (Math.abs(e) < 1e-6 || Math.abs(d) < 1e-6) break; u -= e / d; }
    if (u < 0 || u > 1 || Math.abs(sx(u) - x) > 1e-4) { let lo = 0, hi = 1; u = x; for (let i = 0; i < 30; i++) { const v = sx(u); if (v < x) lo = u; else hi = u; u = (lo + hi) / 2; } }
    return sy(u);
  };
}
const E = bezier(0.22, 1, 0.36, 1);          // entrances
const EX = bezier(0.55, 0, 0.75, 0.25);      // exits (ease-in; used with ~30% shorter durations)
const EIO = p => 0.5 - 0.5 * Math.cos(Math.PI * clamp(p));
const outCubic = p => 1 - Math.pow(1 - clamp(p), 3);

  const pulse = Math.max(bump(t, 14.8, 15.0, 15.28), bump(t, 21.82, 22.0, 22.28));
  css(cam, 'transform', `translate(${n(960 - cx * s)}px,${n(540 - cy * s)}px) scale(${n(s)})`);
  fx(cam, 1, 26 * pulse);
  const ab = prog(t, 14.96, 15.04);
  fx(subA, 1 - ab); show(subA, ab < 1); fx(subB, ab); show(subB, ab > 0);
  show(appA, ab < 0.5); show(appB, ab >= 0.5);

  // popup wheel
  const k = t < 15 ? 0 : t < 22 ? 1 : 2, t0 = POP_T[k];
  const pin = prog(t, t0, t0 + 0.4), pout = prog(t, t0 + 0.68, t0 + 0.93);
  if (t < t0 || pout >= 1) show(wPop.el, false); else {
    show(wPop.el, true); const wi = wheelIn(pin), wo = wheelOut(pout);
    wPop.place(PCX, PCY, 0.95 * wi.s * wo.s, wi.o * wo.o, wi.blur + wo.blur);
    wPop.setSel(POP_A[k] - 60 * (1 - E(prog(t, t0 + 0.16, t0 + 0.42))), E(prog(t, t0 + 0.14, t0 + 0.26)));
  }
  const panelFx = (el, tin, tout, h) => {
    const a = prog(t, tin, tin + 0.38), b = prog(t, tout, tout + 0.25);
    if (a <= 0 || b >= 1) { show(el, false); return false; }
    show(el, true); const ea = E(a), eb = EX(b);
    css(el, 'left', (PCX - 310) + 'px'); css(el, 'top', (PCY - h / 2) + 'px');
    css(el, 'transform', `translateY(${n((1 - ea) * 24)}px) scale(${n((0.94 + 0.06 * ea) * (1 - 0.05 * eb))})`);
    fx(el, clamp(a * 2.5) * (1 - eb), 10 * (1 - ea) + 10 * eb); return true;
  };
  const caret = (on = true) => on ? `<span class="caret" style="opacity:${Math.floor(t * 2.4) % 2 ? 0 : 1}"></span>` : '';

  // a) Notes
  if (panelFx(notesP, 12.35, 99, 480)) {
    const str = 'Read SIMA 2 paper', nC = Math.floor(prog(t, 12.8, 13.85) * str.length);
    const saved = t >= 14.05;
    htm(nT0, nC === 0 && !saved ? '<span style="color:#6f6f78">New note…</span>' + caret() : esc(str.slice(0, nC)) + caret(!saved));
    txt(nM0, saved ? 'Just now · saved' : 'New note · typing…');
    css(nSel, 'background', saved ? `rgba(37,70,232,${n(0.55 * (1 - prog(t, 14.05, 14.6)) + 0.0)})` : '#26262C');
  }
  // b) Ask AI
  if (panelFx(aiP, 16.15, 20.62, 560)) {
    const pc = Math.floor(prog(t, 16.6, 18.3) * PROMPT.length);
    htm(aiBox, pc === 0 ? '<span style="color:#6f6f78">Ask anything…</span>' + caret() : esc(PROMPT.slice(0, pc)) + caret(t < 18.4));
    const la = E(prog(t, 18.35, 18.6)); css(aiLab, 'opacity', String(n(la)));
    const ac = Math.floor(prog(t, 18.6, 20.15) * ANSWER.length);
    htm(aiText, t < 18.6 ? (t > 18.35 ? '<span style="color:#6f6f78">Thinking…</span>' : '') : esc(ANSWER.slice(0, ac)).replace(/\n/g, '<br>') + (ac < ANSWER.length ? '<span style="color:#2546E8">▍</span>' : ''));
  }
  // toast
  {
    const a = prog(t, 20.28, 20.8), b = prog(t, 21.25, 21.5);
    if (a <= 0 || b >= 1) show(toast, false); else {
      show(toast, true);
      css(toast, 'transform', `translate(-50%,0) translateY(${n((1 - E(a)) * 30 + EX(b) * 20)}px) scale(${n((0.7 + 0.3 * backOut(a, 1.4)) * (1 - 0.1 * EX(b)))})`);
      fx(toast, clamp(a * 3) * (1 - EX(b)), 6 * EX(b));
    }
  }
  // c) Clipboard
  if (panelFx(clipP, 23.05, 24.22, 520)) {
    const si = stepVal(t, [0, 23.75], [0, 1], 0.22);
    const hit = bump(t, 24.08, 24.14, 24.3);
    css(cSel, 'transform', `translateY(${n(si * 64)}px)`);
    css(cSel, 'background', hit > 0 ? `rgb(${n(lerp(38, 37, hit))},${n(lerp(38, 70, hit))},${n(lerp(44, 232, hit))})` : '#26262C');
    cF0.classList.toggle('hot', hit > 0.2);
  }
  // mail body
  if (ab > 0) {
    let h = '';
    if (t >= 20.85) {
      const hl = 1 - prog(t, 20.95, 21.7), op = E(prog(t, 20.85, 21.1));
      h += `<span style="opacity:${n(op)};background:rgba(37,70,232,${n(0.16 * hl)});border-radius:4px">${esc(ANSWER).replace(/\n/g, '<br>')}</span>`;
    }
    if (t >= 24.45) {
      const hl = 1 - prog(t, 24.5, 25.2);
      h += `<br><br><span style="background:rgba(37,70,232,${n(0.16 * hl)});border-radius:4px">Here it is: <a>https://tryhelix.app</a></span>`;
    }
    if (t >= 25.05) { const s2 = 'Best regards', c2 = Math.floor(prog(t, 25.1, 25.75) * s2.length); h += '<br><br>' + esc(s2.slice(0, c2)); }
    h += caret();
    htm(mbody, h);
  }
  // HUD
  const hIn = E(prog(t, 11.45, 11.8));
  fx(hud, hIn);
  setRoll(hudRoll, rollState(t, [11.55, 15.45, 22.35], ['Notes', 'Ask AI', 'Clipboard'], 0.5));
  wMini.place(1920 - 90 - 55, 1080 - 78 - 55, 110 / 520 * (0.85 + 0.15 * backOut(prog(t, 11.45, 11.9))) * (1 + 0.08 * bump(t, POP_T[k] + 0.2, POP_T[k] + 0.35, POP_T[k] + 0.6)));
  wMini.setSel(stepVal(t, [11.2, 15.6, 22.5], POP_A, 0.3), E(prog(t, 11.85, 12.05)));
}

function S6(t) {
  if (!layerFx(L[6], env(t, 27.0, 31.5))) return;
  const idx = t < 28.5 ? 0 : t < 30 ? 1 : 2;
  wS6.setTheme(LOOKS[idx][3]);
  const pulse = Math.max(bump(t, 28.3, 28.5, 28.78), bump(t, 29.8, 30.0, 30.28));
  const wi = wheelIn(prog(t, 27.05, 27.5));
  wS6.place(1340, 540, 1.15 * wi.s * (1 - 0.08 * pulse), wi.o, wi.blur + 16 * pulse);
  wS6.setSel(stepVal(t, [27, 27.75, 28.5, 29.25, 30, 30.75], [0, 45, 90, 135, 180, 225], 0.25), E(prog(t, 27.3, 27.5)));
  const nat = EIO(prog(t, 28.35, 28.6)) * (1 - EIO(prog(t, 29.85, 30.1)));
  blobs.forEach((b, i) => { css(b, 'opacity', String(n(nat * 0.9))); css(b, 'transform', `translate(${n(Math.sin(t * 0.9 + i * 2) * 40)}px,${n(Math.cos(t * 0.7 + i) * 30)}px)`); });
  setReveal(lkCap, t, 27.1, 0.05, 0.55);
  setRoll(lkName, rollState(t, LOOK_T, LOOKS.map(l => l[0]), 0.55));
  setRoll(lkSub, rollState(t, LOOK_T, LOOKS.map(l => l[1]), 0.55, 0.06));
  setRoll(lkMode, rollState(t, LOOK_T, LOOKS.map(l => l[2]), 0.5, 0.1));
  const mIn = E(prog(t, 27.25, 27.6)); css(lkModeBox, 'opacity', String(n(mIn)));
  css(lkDot, 'background', idx === 2 ? '#fff' : idx === 1 ? 'rgba(64,64,72,.6)' : '#0A090B');
  css(lkDot, 'boxShadow', idx === 2 ? 'inset 0 0 0 1.5px #2546E8' : 'none');
}

function S7(t) {
  if (!layerFx(L[7], env(t, 31.5, 35.5))) return;
  const wi = wheelIn(prog(t, 31.55, 32.0));
  const rm = E(prog(t, 33.4, 33.85));
  const rp = bump(t, 33.35, 33.6, 33.9);
  wS7.place(960, 470, wi.s * (1 - 0.05 * rp), wi.o, wi.blur + 6 * rp);
  wS7.setRing(rm);
  txt(wS7.pager, t < 33.62 ? 'Ring 1 of 2' : 'Ring 2 of 2');
  const ST = [31.9, 32.4, 32.9, 33.4, 33.9, 34.4, 34.9];
  wS7.setSel(stepVal(t, ST, [0, 45, 90, 135, 180, 225, 270], 0.22), E(prog(t, 31.85, 32.05)));
  const w = Math.floor((t - 32.55) / 0.42), lp = (t - 32.55) / 0.42 - w;
  tnames.forEach((tn, i) => {
    const pi = E(prog(t, 31.7 + tn.ord * 0.7, 32.2 + tn.ord * 0.7));
    const cur = w >= 0 && hash(i, w) < 0.34 ? 1 : 0, prev = w >= 1 && hash(i, w - 1) < 0.34 ? 1 : 0;
    const r = E(clamp(lp / 0.4)), lit = Math.max(cur * r, prev * (1 - r), cur && prev ? 1 : 0);
    const fl = Math.sin(t * 0.8 + i * 1.7) * 6;
    css(tn.el, 'transform', `translate(-50%,-50%) translateY(${n((1 - pi) * 26 + fl)}px) scale(${n(1 + 0.06 * lit)})`);
    fx(tn.el, pi, (1 - pi) * 8);
    css(tn.el, 'color', `rgb(${n(lerp(160, 37, lit))},${n(lerp(160, 70, lit))},${n(lerp(166, 232, lit))})`);
    css(tn.dot, 'background', `rgba(37,70,232,${n(0.15 + 0.85 * lit)})`);
  });
  setReveal(big16w, t, 31.75, 0.08, 0.6);
}

function S8(t) {
  if (!layerFx(L[8], env(t, 35.5, 41.5))) return;
  let p = -1 + E(prog(t, 35.45, 36.05));
  CAR_STEPS.forEach(s => { p += E(prog(t, s, s + 0.5)); });
  cards.forEach((c, i) => {
    const d = i - p, ad = Math.abs(d);
    if (ad > 2.6) { show(c, false); return; }
    show(c, true);
    const x = d * 560 + Math.sign(d) * Math.max(0, ad - 1) * -60, z = -ad * 280, ry = -25 * clamp(d, -1, 1);
    css(c, 'transform', `translateX(${n(x)}px) translateZ(${n(z)}px) rotateY(${n(ry)}deg)`);
    fx(c, 1 - clamp(ad - 1.6), 6 * clamp(ad));
    css(c, 'zIndex', String(100 - Math.round(ad * 10)));
  });
  setRoll(carRoll, rollState(t, [35.6, ...CAR_STEPS.map(s => s + 0.18)], CARDS.map(c => c[0]), 0.45));
  // live details
  const arcP = 0.999 - 0.08 * prog(t, 37.5, 40.5);
  attr(clkArc, 'd', arcPath(128, 0, 360 * arcP));
  waveBars.forEach((b, i) => css(b, 'height', `${n(16 + 110 * Math.abs(Math.sin(t * 5.3 + i * 0.55) * Math.sin(t * 2.1 + i * 0.23)))}px`));
  const rp = 0.5 + 0.5 * Math.sin(t * 6);
  css(recDot, 'transform', `scale(${n(0.9 + 0.1 * rp)})`); css(recDot, 'boxShadow', `0 0 ${n(10 + 20 * rp)}px rgba(255,59,48,${n(0.4 + 0.3 * rp)})`);
}

function S9(t) {
  if (!layerFx(L[9], env(t, 41.5, DUR))) return;
  const pl = prog(t, 41.75, 42.4);
  css(logo, 'transform', `scale(${n(pl <= 0 ? 0 : 0.3 + 0.7 * backOut(pl, 1.7))}) rotate(${n(-50 * (1 - E(pl)))}deg)`);
  fx(logo, clamp(pl * 4), 8 * (1 - E(pl)));
  setReveal(eNameW, t, 42.05, 0.06, 0.6);
  setReveal(eTagW, t, 42.35, 0.05, 0.55);
  const pb = prog(t, 42.7, 43.2);
  css(eBtn, 'transform', `translateX(-50%) translateY(${n((1 - E(pb)) * 30)}px) scale(${n(0.85 + 0.15 * backOut(pb, 1.2))})`);
  fx(eBtn, clamp(pb * 2.5), 8 * (1 - E(pb)));
  setReveal(eSmallW, t, 42.95, 0.04, 0.5);
}

function render(t) {
  t = ((t % DUR) + DUR) % DUR;
  renderBG(t);
  S1(t); S2(t); S3(t); S4(t); S5(t); S6(t); S7(t); S8(t); S9(t);
  // hook FX: shockwave + flash
  const ps = prog(t, 0.35, 0.9);
  css(shock, 'transform', `scale(${n(0.25 + 2.6 * outCubic(ps))})`);
  css(shock, 'opacity', String(n(t >= 0.35 && ps < 1 ? (1 - ps) * 0.95 : 0)));
  css(shock, 'borderWidth', `${n(3 * (1 - ps) + 1)}px`);
  const fl = t < 0.35 ? 0 : t < 0.42 ? 0.72 * EIO(prog(t, 0.35, 0.42)) : 0.72 * (1 - outCubic(prog(t, 0.42, 0.78)));
  css(flash, 'opacity', String(n(fl)));
  // loop: end card settles to 60% and the hook rises from it
  const d = 0.4 * EIO(prog(t, 45.2, 45.8)) + 0.4 * (1 - EIO(prog(t, 0, 0.16)));
  css(dim, 'opacity', String(n(d)));
}
window.render = render;
window.HELIX_DURATION = DUR;

/* ======================================================= playback / input */
function fit() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = `translate(${(innerWidth - 1920 * s) / 2}px,${(innerHeight - 1080 * s) / 2}px) scale(${s})`;
}
addEventListener('resize', fit); fit();

const params = new URLSearchParams(location.search);
let T = parseFloat(params.get('t')) || 0, playing = !params.has('paused') && !params.has('render'), last = null;
const pauseTag = document.getElementById('pauseTag');
window.helix = { play() { playing = true; }, pause() { playing = false; }, seek(x) { T = ((x % DUR) + DUR) % DUR; render(T); }, get time() { return T; } };
function frame(now) {
  if (last == null) last = now;
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (playing) T = (T + dt) % DUR;
  if (!params.has('render')) render(T);
  pauseTag.style.display = playing || params.has('render') ? 'none' : 'block';
  requestAnimationFrame(frame);
}
addEventListener('keydown', ev => {
  if (ev.code === 'Space') { ev.preventDefault(); playing = !playing; }
  else if (ev.code === 'ArrowRight') { ev.preventDefault(); const nx = SCENES.find(s => s > T + 0.01); T = nx == null ? 0 : nx; render(T); }
  else if (ev.code === 'ArrowLeft') { ev.preventDefault(); const pv = [...SCENES].reverse().find(s => s < T - 0.3); T = pv == null ? SCENES[SCENES.length - 1] : pv; render(T); }
});
render(T);
requestAnimationFrame(frame);
})();
</script>
